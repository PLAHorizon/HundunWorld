<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style id="theme-vars">
/* ============================================
   混沌世界登录界面 — 品牌 CSS
   水墨写意融合风格 · 青灰 + 水墨青绿
   Free Explore Mode · Light Only
   ============================================ */

:root {
  /* ---- 品牌主色相：水墨青绿 (seedColor: #4A7C7E) ---- */
  --hd-primary-50: #EEF4F4;
  --hd-primary-100: #D6E5E5;
  --hd-primary-200: #ADCCCC;
  --hd-primary-300: #84B3B4;
  --hd-primary-400: #5F9496;
  --hd-primary-500: #4A7C7E;
  --hd-primary-600: #3A6567;
  --hd-primary-700: #2D4E50;
  --hd-primary-800: #1F3839;
  --hd-primary-900: #122324;

  /* ---- 中性系统：青灰 (slate blue-gray) ---- */
  --hd-ink-900: #1C2128;
  --hd-ink-800: #2A323D;
  --hd-ink-700: #3A4654;
  --hd-ink-600: #4A5664;
  --hd-ink-500: #5C6878;
  --hd-ink-400: #7A8593;
  --hd-ink-300: #A8B0BC;
  --hd-ink-200: #CDD3DB;
  --hd-ink-100: #E5E9ED;
  --hd-ink-50: #F2F4F6;
  --hd-paper: #F5F6F4;

  /* ---- 语义状态色 (仅状态语义，非身份/分类) ---- */
  --state-error: #B85450;
  --state-success: #5E8B5E;
  --state-warning: #C49B5E;
  --state-info: #4A7C7E;

  /* ---- 圆角系统 (克制雅致，最大12px) ---- */
  --hd-radius-sm: 4px;
  --hd-radius-md: 8px;
  --hd-radius-lg: 12px;
  --hd-radius-full: 9999px;

  /* ---- 字体系统 ---- */
  --hd-font-display: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --hd-font-body: "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif;

  /* ---- 间距系统 ---- */
  --hd-space-xs: 4px;
  --hd-space-sm: 8px;
  --hd-space-md: 16px;
  --hd-space-lg: 24px;
  --hd-space-xl: 32px;
  --hd-space-2xl: 48px;
  --hd-space-3xl: 64px;

  /* ---- 语义别名 (Tailwind @theme 桥接) ---- */
  --hd-background: var(--hd-paper);
  --hd-foreground: var(--hd-ink-700);
  --hd-primary: var(--hd-primary-500);
  --hd-primary-foreground: #ffffff;
  --hd-card: var(--hd-paper);
  --hd-card-foreground: var(--hd-ink-700);
  --hd-border: var(--hd-ink-200);
  --hd-input: var(--hd-ink-200);
  --hd-ring: var(--hd-primary-400);
  --hd-muted: var(--hd-ink-50);
  --hd-muted-foreground: var(--hd-ink-500);
  --hd-radius-small: var(--hd-radius-sm);
  --hd-radius-medium: var(--hd-radius-md);
  --hd-radius-large: var(--hd-radius-lg);
}

/* ============================================
   排版工具类
   ============================================ */

.hd-display {
  font-family: var(--hd-font-display);
  font-size: 48px;
  line-height: 56px;
  font-weight: 700;
  letter-spacing: 0.15em;
}

.hd-heading-lg {
  font-family: var(--hd-font-display);
  font-size: 28px;
  line-height: 36px;
  font-weight: 600;
  letter-spacing: 0.05em;
}

.hd-heading-md {
  font-family: var(--hd-font-display);
  font-size: 20px;
  line-height: 28px;
  font-weight: 600;
  letter-spacing: 0.03em;
}

.hd-body-lg {
  font-family: var(--hd-font-body);
  font-size: 16px;
  line-height: 26px;
  font-weight: 400;
}

.hd-body {
  font-family: var(--hd-font-body);
  font-size: 14px;
  line-height: 22px;
  font-weight: 400;
}

.hd-body-sm {
  font-family: var(--hd-font-body);
  font-size: 12px;
  line-height: 18px;
  font-weight: 400;
}

/* ============================================
   基础重置
   ============================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--hd-font-body);
  background-color: var(--hd-paper);
  color: var(--hd-ink-700);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--hd-background);
    --color-foreground: var(--hd-foreground);
    --color-card: var(--hd-card);
    --color-card-foreground: var(--hd-card-foreground);
    --color-primary: var(--hd-primary);
    --color-primary-foreground: var(--hd-primary-foreground);
    --color-muted: var(--hd-muted);
    --color-muted-foreground: var(--hd-muted-foreground);
    --color-border: var(--hd-border);
    --color-input: var(--hd-input);
    --color-ring: var(--hd-ring);
    --radius-sm: var(--hd-radius-small);
    --radius-md: var(--hd-radius-medium);
    --radius-lg: var(--hd-radius-large);
  }
  @layer base {
    body { background: var(--hd-background); color: var(--hd-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .no-scrollbar::-webkit-scrollbar { display: none; }

        mask-repeat: no-repeat;

        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Google Fonts: Noto Serif SC (标题/书法) + Noto Sans SC (正文) -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">

      <!-- ==================================================
           外壳 DOM 结构 (from partials/project-shell.html)
           槽位已替换：pageTitle → 登录标题, pageContent → 登录表单面板
           ================================================== -->
      <div class="hd-shell-root">

        <!-- 1. 全屏背景层 (z-index: 0) -->
        <div class="hd-shell-bg-layer">
          <img src="../assets/login-bg.jpg" alt="水墨写意山水云雾背景" class="hd-shell-bg-img" />
          <div class="hd-shell-bg-overlay"></div>
          <div class="hd-shell-mist"></div>
          <div class="hd-shell-light hd-shell-light--1"></div>
          <div class="hd-shell-light hd-shell-light--2"></div>
          <div class="hd-shell-light hd-shell-light--3"></div>
        </div>

        <!-- 内容区：品牌意境区 + 表单区域 -->
        <div class="hd-shell-main">

          <!-- 2. 品牌意境区 (z-index: 10, 左 60%) -->
          <div class="hd-shell-brand">
            <!-- 印章：右上角小方章，落款感 -->
            <div class="hd-seal" aria-label="混沌印章">混沌</div>

            <!-- 游戏名：书法体 -->
            <h1 class="hd-display hd-shell-game-title">混沌世界</h1>

            <!-- 水墨分隔笔触 -->
            <div class="hd-ink-stroke" role="presentation"></div>

            <!-- 引导诗句 -->
            <p class="hd-body-lg hd-shell-poem">一花一世界 · 一叶一菩提</p>

            <!-- 玄幻灵光粒子装饰 -->
            <div class="hd-shell-spirit" aria-hidden="true">
              <span class="hd-spirit-particle hd-spirit-particle--1"></span>
              <span class="hd-spirit-particle hd-spirit-particle--2"></span>
              <span class="hd-spirit-particle hd-spirit-particle--3"></span>
            </div>
          </div>

          <!-- 3. 表单区域 (z-index: 20, 右 40%) -->
          <div class="hd-shell-form-area">

            <!-- SLOT: pageTitle — 替换为"登录"语义标题（无障碍辅助） -->
            <h2 class="hd-sr-only">登录</h2>

            <!-- SLOT: pageContent — 登录表单面板（毛玻璃浮层卡片） -->
            <div class="hd-login-card">
              <!-- 欢迎语 -->
              <div class="hd-login-welcome">
                <h3 class="hd-heading-lg hd-login-welcome-title">欢迎归来</h3>
                <p class="hd-body-sm hd-login-welcome-sub">请登录您的账号</p>
              </div>

              <!-- 登录表单 -->
              <form class="hd-login-form" novalidate>
                <!-- 账号输入框 -->
                <div class="hd-login-field">
                  <label class="hd-body-sm hd-login-label" for="login-account">账号</label>
                  <input
                    type="text"
                    id="login-account"
                    name="account"
                    class="hd-body-lg hd-login-input"
                    placeholder="请输入账号"
                    autocomplete="username"
                    required
                  />
                </div>

                <!-- 密码输入框 -->
                <div class="hd-login-field">
                  <label class="hd-body-sm hd-login-label" for="login-password">密码</label>
                  <div class="hd-login-input-wrap">
                    <input
                      type="password"
                      id="login-password"
                      name="password"
                      class="hd-body-lg hd-login-input hd-login-input--password"
                      placeholder="请输入密码"
                      autocomplete="current-password"
                      required
                    />
                    <button
                      type="button"
                      data-dom-id="toggle-password"
                      class="hd-login-toggle"
                      aria-label="切换密码显隐"
                      aria-pressed="false"
                    >
                      <svg class="hd-login-eye-icon hd-login-eye-icon--show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                      </svg>
                      <svg class="hd-login-eye-icon hd-login-eye-icon--hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                        <line x1="2" y1="2" x2="22" y2="22"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <!-- 记住密码 + 自动登录 -->
                <div class="hd-login-options">
                  <div class="hd-login-checkbox-wrap">
                    <button
                      type="button"
                      data-dom-id="toggle-remember"
                      class="hd-login-checkbox"
                      role="checkbox"
                      aria-checked="false"
                      aria-label="记住密码"
                    >
                      <span class="hd-login-checkbox-dot" aria-hidden="true"></span>
                    </button>
                    <span class="hd-body hd-login-checkbox-label">记住密码</span>
                  </div>
                  <div class="hd-login-checkbox-wrap">
                    <button
                      type="button"
                      data-dom-id="toggle-auto-login"
                      class="hd-login-checkbox"
                      role="checkbox"
                      aria-checked="false"
                      aria-label="自动登录"
                    >
                      <span class="hd-login-checkbox-dot" aria-hidden="true"></span>
                    </button>
                    <span class="hd-body hd-login-checkbox-label">自动登录</span>
                  </div>
                </div>

                <!-- 登录按钮（主 CTA） -->
                <button
                  type="submit"
                  data-dom-id="btn-login"
                  class="hd-login-btn"
                >
                  <span class="hd-login-btn-text">进 入 江 湖</span>
                </button>

                <!-- 注册账号 + 找回密码 -->
                <div class="hd-login-links">
                  <a href="#" data-dom-id="link-register" class="hd-body-sm hd-login-link">注册账号</a>
                  <a href="#" data-dom-id="link-forgot" class="hd-body-sm hd-login-link">找回密码</a>
                </div>
              </form>
            </div>

          </div>

        </div>

        <!-- 4. 辅助层 (z-index: 10, 底部通栏) -->
        <div class="hd-shell-footer">
          <!-- 服务器状态：左下 -->
          <div class="hd-shell-footer-left">
            <span class="hd-status-dot" aria-hidden="true"></span>
            <span class="hd-body-sm hd-shell-footer-text">服务器：烽火连城 · 流畅</span>
          </div>
          <!-- 版本号：居中 -->
          <span class="hd-body-sm hd-shell-footer-version">v1.0.0</span>
          <!-- 版权：右下 -->
          <span class="hd-body-sm hd-shell-footer-copyright">© 混沌世界</span>
        </div>

      </div>
    </main>
    <!-- ==================================================
         外壳组件样式 (from partials/project-shell.html)
         :root 变量与排版工具类已由 <head> 的 theme-vars 提供
         ================================================== -->
    <style>
      /* ---- 外壳根容器 ---- */
      .hd-shell-root {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ---- 1. 全屏背景层 ---- */
      .hd-shell-bg-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: var(--hd-ink-100);
      }

      .hd-shell-bg-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .hd-shell-bg-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(245, 246, 244, 0.3) 0%,
          rgba(28, 33, 40, 0.25) 100%
        );
      }

      .hd-shell-mist {
        position: absolute;
        inset: -10% -5%;
        background: radial-gradient(
          ellipse 70% 50% at 30% 40%,
          rgba(245, 246, 244, 0.14) 0%,
          transparent 60%
        );
        animation: hd-drift 20s ease-in-out infinite;
        will-change: transform;
      }

      .hd-shell-light {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        pointer-events: none;
      }

      .hd-shell-light--1 {
        top: 12%;
        left: 8%;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(173, 204, 204, 0.10) 0%, transparent 70%);
        animation: hd-breathe 10s ease-in-out infinite;
      }

      .hd-shell-light--2 {
        bottom: 22%;
        right: 10%;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(173, 204, 204, 0.08) 0%, transparent 70%);
        animation: hd-breathe 12s ease-in-out infinite 2s;
      }

      .hd-shell-light--3 {
        top: 50%;
        left: 38%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(173, 204, 204, 0.12) 0%, transparent 70%);
        animation: hd-breathe 8s ease-in-out infinite 4s;
      }

      /* ---- 内容区 ---- */
      .hd-shell-main {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: row;
      }

      /* ---- 2. 品牌意境区 ---- */
      .hd-shell-brand {
        position: relative;
        z-index: 10;
        flex: 0 0 60%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 64px 48px;
      }

      .hd-seal {
        position: absolute;
        top: 48px;
        right: 48px;
        width: 48px;
        height: 48px;
        background: var(--hd-primary-700);
        color: var(--hd-paper);
        border-radius: var(--hd-radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--hd-font-display);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1.1;
        text-align: center;
        writing-mode: vertical-rl;
        box-shadow: 0 2px 8px rgba(28, 33, 40, 0.05);
      }

      .hd-shell-game-title {
        color: var(--hd-ink-900);
        text-wrap: balance;
        word-break: keep-all;
        overflow-wrap: break-word;
        text-shadow: 0 1px 2px rgba(245, 246, 244, 0.4);
      }

      .hd-ink-stroke {
        width: 120px;
        height: 3px;
        margin: 24px 0;
        background: linear-gradient(
          to right,
          transparent 0%,
          var(--hd-primary-600) 15%,
          var(--hd-primary-500) 50%,
          var(--hd-primary-600) 85%,
          transparent 100%
        );
        border-radius: var(--hd-radius-full);
        position: relative;
      }

      .hd-ink-stroke::after {
        content: '';
        position: absolute;
        top: -1px;
        left: 25%;
        width: 50%;
        height: 5px;
        background: var(--hd-primary-400);
        border-radius: var(--hd-radius-full);
        filter: blur(1.5px);
        opacity: 0.5;
      }

      .hd-shell-poem {
        color: var(--hd-ink-600);
        letter-spacing: 0.08em;
        text-shadow: 0 1px 2px rgba(245, 246, 244, 0.3);
      }

      .hd-shell-spirit {
        position: absolute;
        bottom: 18%;
        left: 48px;
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .hd-spirit-particle {
        border-radius: var(--hd-radius-full);
        background: var(--hd-primary-300);
        opacity: 0.4;
      }

      .hd-spirit-particle--1 {
        width: 6px;
        height: 6px;
        animation: hd-float 6s ease-in-out infinite;
      }

      .hd-spirit-particle--2 {
        width: 4px;
        height: 4px;
        animation: hd-float 8s ease-in-out infinite 1s;
      }

      .hd-spirit-particle--3 {
        width: 5px;
        height: 5px;
        animation: hd-float 7s ease-in-out infinite 2.5s;
      }

      /* ---- 3. 表单区域 ---- */
      .hd-shell-form-area {
        position: relative;
        z-index: 20;
        flex: 0 0 40%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      /* ---- 4. 辅助层 ---- */
      .hd-shell-footer {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 48px;
        background: linear-gradient(
          to top,
          rgba(28, 33, 40, 0.08) 0%,
          transparent 100%
        );
      }

      .hd-shell-footer-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .hd-status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: var(--hd-radius-full);
        background: var(--state-success);
        animation: hd-pulse 3s ease-in-out infinite;
        flex-shrink: 0;
      }

      .hd-shell-footer-text {
        color: var(--hd-ink-500);
      }

      .hd-shell-footer-version {
        color: var(--hd-ink-400);
      }

      .hd-shell-footer-copyright {
        color: var(--hd-ink-400);
      }

      /* ---- 动画 ---- */
      @keyframes hd-breathe {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }

      @keyframes hd-drift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(30px); }
      }

      @keyframes hd-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      @keyframes hd-float {
        0%, 100% { transform: translateY(0); opacity: 0.3; }
        50% { transform: translateY(-12px); opacity: 0.7; }
      }

      /* ---- 响应式：平板 (≤1023px) ---- */
      @media (max-width: 1023px) {
        .hd-shell-main {
          flex-direction: column;
        }

        .hd-shell-brand {
          flex: 0 0 auto;
          width: 100%;
          min-height: 35vh;
          padding: 48px 24px;
        }

        .hd-shell-form-area {
          flex: 0 0 auto;
          width: 100%;
          min-height: 50vh;
          padding: 24px;
        }

        .hd-shell-footer {
          padding: 12px 24px;
          flex-wrap: wrap;
          gap: 8px;
          justify-content: center;
        }

        .hd-seal {
          top: 24px;
          right: 24px;
        }

        .hd-shell-spirit {
          left: 24px;
        }
      }

      /* ---- 响应式：手机 (≤639px) ---- */
      @media (max-width: 639px) {
        .hd-shell-brand {
          min-height: 30vh;
          padding: 32px 16px;
        }

        .hd-shell-form-area {
          min-height: 55vh;
          padding: 16px;
        }

        .hd-shell-footer {
          padding: 8px 16px;
          flex-direction: column;
          gap: 4px;
        }

        .hd-seal {
          top: 16px;
          right: 16px;
          width: 40px;
          height: 40px;
          font-size: 13px;
        }

        .hd-shell-spirit {
          left: 16px;
          bottom: 12%;
        }
      }

      /* ---- prefers-reduced-motion 降级 ---- */
      @media (prefers-reduced-motion: reduce) {
        .hd-shell-mist,
        .hd-shell-light--1,
        .hd-shell-light--2,
        .hd-shell-light--3,
        .hd-spirit-particle--1,
        .hd-spirit-particle--2,
        .hd-spirit-particle--3,
        .hd-status-dot {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

    <!-- ==================================================
         页面私有样式 — 登录表单面板
         ================================================== -->
    <style>
      /* ---- 无障碍辅助 ---- */
      .hd-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ---- 毛玻璃浮层卡片 ---- */
      .hd-login-card {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background: rgba(245, 246, 244, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: var(--hd-radius-lg);
        box-shadow: 0 8px 40px rgba(28, 33, 40, 0.12);
        padding: 32px 36px;
        max-width: 400px;
        width: 100%;
      }

      /* ---- 欢迎语 ---- */
      .hd-login-welcome {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 32px;
      }

      .hd-login-welcome-title {
        color: var(--hd-ink-800);
        text-wrap: balance;
        word-break: keep-all;
      }

      .hd-login-welcome-sub {
        color: var(--hd-ink-500);
      }

      /* ---- 表单 ---- */
      .hd-login-form {
        display: flex;
        flex-direction: column;
      }

      /* ---- 表单字段 ---- */
      .hd-login-field {
        display: flex;
        flex-direction: column;
      }

      .hd-login-field + .hd-login-field {
        margin-top: 24px;
      }

      .hd-login-label {
        color: var(--hd-ink-500);
        margin-bottom: 8px;
      }

      /* ---- 底线输入框 ---- */
      .hd-login-input {
        width: 100%;
        border: none;
        border-bottom: 1px solid var(--hd-ink-200);
        background: transparent;
        padding: 12px 0;
        color: var(--hd-ink-800);
        outline: none;
        transition: border-bottom-color 0.2s ease, box-shadow 0.2s ease;
      }

      .hd-login-input::placeholder {
        color: var(--hd-ink-300);
      }

      .hd-login-input:focus {
        border-bottom-color: var(--hd-primary-400);
        box-shadow: 0 1px 0 0 var(--hd-primary-400);
      }

      /* ---- 密码输入框容器 ---- */
      .hd-login-input-wrap {
        position: relative;
      }

      .hd-login-input--password {
        padding-right: 36px;
      }

      /* ---- 眼睛切换按钮 ---- */
      .hd-login-toggle {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        padding: 4px;
        cursor: pointer;
        color: var(--hd-ink-400);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--hd-radius-sm);
        transition: color 0.2s ease;
      }

      .hd-login-toggle:hover {
        color: var(--hd-ink-600);
      }

      .hd-login-toggle:focus-visible {
        outline: 2px solid var(--hd-primary-400);
        outline-offset: 2px;
      }

      .hd-login-eye-icon {
        display: block;
      }

      /* ---- 记住密码 + 自动登录 ---- */
      .hd-login-options {
        display: flex;
        gap: 24px;
        margin-top: 20px;
      }

      .hd-login-checkbox-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .hd-login-checkbox {
        width: 18px;
        height: 18px;
        border-radius: var(--hd-radius-full);
        border: 1px solid var(--hd-ink-300);
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex-shrink: 0;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .hd-login-checkbox:focus-visible {
        outline: 2px solid var(--hd-primary-400);
        outline-offset: 2px;
      }

      .hd-login-checkbox-dot {
        width: 8px;
        height: 8px;
        border-radius: var(--hd-radius-full);
        background: white;
        opacity: 0;
        transform: scale(0);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .hd-login-checkbox[aria-checked="true"] {
        background: var(--hd-primary-500);
        border-color: var(--hd-primary-500);
      }

      .hd-login-checkbox[aria-checked="true"] .hd-login-checkbox-dot {
        opacity: 1;
        transform: scale(1);
      }

      .hd-login-checkbox-label {
        color: var(--hd-ink-600);
        user-select: none;
      }

      /* ---- 登录按钮（主 CTA） ---- */
      .hd-login-btn {
        width: 100%;
        background: var(--hd-primary-500);
        color: white;
        border: none;
        border-radius: var(--hd-radius-md);
        padding: 14px 0;
        font-family: var(--hd-font-body);
        font-size: 14px;
        line-height: 22px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 28px;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .hd-login-btn-text {
        letter-spacing: 0.3em;
        color: white;
      }

      .hd-login-btn:hover {
        background: var(--hd-primary-600);
      }

      .hd-login-btn:active {
        background: var(--hd-primary-700);
        transform: scale(0.98);
      }

      .hd-login-btn:focus-visible {
        outline: 2px solid var(--hd-primary-400);
        outline-offset: 2px;
      }

      /* ---- 注册账号 + 找回密码 ---- */
      .hd-login-links {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .hd-login-link {
        color: var(--hd-primary-600);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .hd-login-link:hover {
        text-decoration: underline;
        color: var(--hd-primary-700);
      }

      .hd-login-link:focus-visible {
        outline: 2px solid var(--hd-primary-400);
        outline-offset: 2px;
        border-radius: var(--hd-radius-sm);
      }

      /* ---- 响应式：手机 (≤639px) ---- */
      @media (max-width: 639px) {
        .hd-login-card {
          padding: 24px 20px;
        }
      }

      /* ---- prefers-reduced-motion 降级 ---- */
      @media (prefers-reduced-motion: reduce) {
        .hd-login-input,
        .hd-login-toggle,
        .hd-login-checkbox,
        .hd-login-checkbox-dot,
        .hd-login-btn,
        .hd-login-link {
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <!-- ==================================================
         页面交互脚本 — 原生 JS，无第三方依赖
         ================================================== -->
    <script>
      (function () {
        'use strict';

        // ---- 密码显隐切换 ----
        var togglePassword = document.querySelector('[data-dom-id="toggle-password"]');
        var passwordInput = document.getElementById('login-password');
        var eyeShow = document.querySelector('.hd-login-eye-icon--show');
        var eyeHide = document.querySelector('.hd-login-eye-icon--hide');

        if (togglePassword && passwordInput) {
          togglePassword.addEventListener('click', function () {
            var isPressed = togglePassword.getAttribute('aria-pressed') === 'true';
            if (isPressed) {
              passwordInput.setAttribute('type', 'password');
              togglePassword.setAttribute('aria-pressed', 'false');
              if (eyeShow) eyeShow.style.display = '';
              if (eyeHide) eyeHide.style.display = 'none';
            } else {
              passwordInput.setAttribute('type', 'text');
              togglePassword.setAttribute('aria-pressed', 'true');
              if (eyeShow) eyeShow.style.display = 'none';
              if (eyeHide) eyeHide.style.display = '';
            }
          });
        }

        // ---- 复选框切换（记住密码 / 自动登录） ----
        function setupCheckbox(btn) {
          if (!btn) return;
          btn.addEventListener('click', function () {
            var checked = btn.getAttribute('aria-checked') === 'true';
            btn.setAttribute('aria-checked', checked ? 'false' : 'true');
          });
        }

        setupCheckbox(document.querySelector('[data-dom-id="toggle-remember"]'));
        setupCheckbox(document.querySelector('[data-dom-id="toggle-auto-login"]'));

        // ---- 表单提交（静态演示，阻止默认跳转） ----
        var form = document.querySelector('.hd-login-form');
        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
          });
        }
      })();
    </script>

    <script>lucide.createIcons();</script>
</body>
</html>
