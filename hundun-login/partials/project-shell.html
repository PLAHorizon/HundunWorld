<!-- Tailwind CSS v4 Browser CDN — 供独立预览使用；叶子页面 <head> 已由 fill-html-head.mjs 包含 -->

<style>
  /* ================================================
     品牌 CSS 变量 (from colors_and_type.css)
     ================================================ */
  :root {
    /* 品牌主色相：水墨青绿 (seedColor: #4A7C7E) */
    --hd-primary-50: #EEF4F4;
    --hd-primary-100: #D6E5E5;
    --hd-primary-200: #ADCCCC;
    --hd-primary-300: #84B3B4;
    --hd-primary-400: #5F9496;
    --hd-primary-500: #4A7C7E;
    --hd-primary-600: #3A6567;
    --hd-primary-700: #2D4E50;
    --hd-primary-800: #1F3839;
    --hd-primary-900: #122324;

    /* 中性系统：青灰 (slate blue-gray) */
    --hd-ink-900: #1C2128;
    --hd-ink-800: #2A323D;
    --hd-ink-700: #3A4654;
    --hd-ink-600: #4A5664;
    --hd-ink-500: #5C6878;
    --hd-ink-400: #7A8593;
    --hd-ink-300: #A8B0BC;
    --hd-ink-200: #CDD3DB;
    --hd-ink-100: #E5E9ED;
    --hd-ink-50: #F2F4F6;
    --hd-paper: #F5F6F4;

    /* 语义状态色 (仅状态语义，非身份/分类) */
    --state-error: #B85450;
    --state-success: #5E8B5E;
    --state-warning: #C49B5E;
    --state-info: #4A7C7E;

    /* 圆角系统 */
    --hd-radius-sm: 4px;
    --hd-radius-md: 8px;
    --hd-radius-lg: 12px;
    --hd-radius-full: 9999px;

    /* 字体系统 */
    --hd-font-display: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    --hd-font-body: "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif;

    /* 间距系统 */
    --hd-space-xs: 4px;
    --hd-space-sm: 8px;
    --hd-space-md: 16px;
    --hd-space-lg: 24px;
    --hd-space-xl: 32px;
    --hd-space-2xl: 48px;
    --hd-space-3xl: 64px;
  }

  /* ================================================
     排版工具类
     ================================================ */
  .hd-display {
    font-family: var(--hd-font-display);
    font-size: 48px;
    line-height: 56px;
    font-weight: 700;
    letter-spacing: 0.15em;
  }

  .hd-heading-lg {
    font-family: var(--hd-font-display);
    font-size: 28px;
    line-height: 36px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .hd-body-lg {
    font-family: var(--hd-font-body);
    font-size: 16px;
    line-height: 26px;
    font-weight: 400;
  }

  .hd-body {
    font-family: var(--hd-font-body);
    font-size: 14px;
    line-height: 22px;
    font-weight: 400;
  }

  .hd-body-sm {
    font-family: var(--hd-font-body);
    font-size: 12px;
    line-height: 18px;
    font-weight: 400;
  }

  /* ================================================
     基础重置
     ================================================ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--hd-font-body);
    background-color: var(--hd-paper);
    color: var(--hd-ink-700);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ================================================
     外壳根容器
     ================================================ */
  .hd-shell-root {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ================================================
     1. 全屏背景层 (z-index: 0)
     ================================================ */
  .hd-shell-bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--hd-ink-100);
  }

  .hd-shell-bg-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* 渐变遮罩：顶部云雾淡 → 底部墨色沉 */
  .hd-shell-bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(245, 246, 244, 0.3) 0%,
      rgba(28, 33, 40, 0.25) 100%
    );
  }

  /* 半透明云雾漂移层 (20s 周期) */
  .hd-shell-mist {
    position: absolute;
    inset: -10% -5%;
    background: radial-gradient(
      ellipse 70% 50% at 30% 40%,
      rgba(245, 246, 244, 0.14) 0%,
      transparent 60%
    );
    animation: hd-drift 20s ease-in-out infinite;
    will-change: transform;
  }

  /* 水墨青绿微光斑 — 玄幻灵气呼吸 (8-12s 周期) */
  .hd-shell-light {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    pointer-events: none;
  }

  .hd-shell-light--1 {
    top: 12%;
    left: 8%;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(173, 204, 204, 0.10) 0%, transparent 70%);
    animation: hd-breathe 10s ease-in-out infinite;
  }

  .hd-shell-light--2 {
    bottom: 22%;
    right: 10%;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(173, 204, 204, 0.08) 0%, transparent 70%);
    animation: hd-breathe 12s ease-in-out infinite 2s;
  }

  .hd-shell-light--3 {
    top: 50%;
    left: 38%;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, rgba(173, 204, 204, 0.12) 0%, transparent 70%);
    animation: hd-breathe 8s ease-in-out infinite 4s;
  }

  /* ================================================
     内容区 (品牌意境区 + 表单区域占位)
     ================================================ */
  .hd-shell-main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: row;
  }

  /* ================================================
     2. 品牌意境区 (z-index: 10, 左 60%)
     ================================================ */
  .hd-shell-brand {
    position: relative;
    z-index: 10;
    flex: 0 0 60%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 48px;
  }

  /* 印章：右上角小方章 */
  .hd-seal {
    position: absolute;
    top: 48px;
    right: 48px;
    width: 48px;
    height: 48px;
    background: var(--hd-primary-700);
    color: var(--hd-paper);
    border-radius: var(--hd-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--hd-font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.1;
    text-align: center;
    writing-mode: vertical-rl;
    box-shadow: 0 2px 8px rgba(28, 33, 40, 0.05);
  }

  /* 游戏名 */
  .hd-shell-game-title {
    color: var(--hd-ink-900);
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-shadow: 0 1px 2px rgba(245, 246, 244, 0.4);
  }

  /* 水墨分隔笔触 */
  .hd-ink-stroke {
    width: 120px;
    height: 3px;
    margin: 24px 0;
    background: linear-gradient(
      to right,
      transparent 0%,
      var(--hd-primary-600) 15%,
      var(--hd-primary-500) 50%,
      var(--hd-primary-600) 85%,
      transparent 100%
    );
    border-radius: var(--hd-radius-full);
    position: relative;
  }

  .hd-ink-stroke::after {
    content: '';
    position: absolute;
    top: -1px;
    left: 25%;
    width: 50%;
    height: 5px;
    background: var(--hd-primary-400);
    border-radius: var(--hd-radius-full);
    filter: blur(1.5px);
    opacity: 0.5;
  }

  /* 引导诗句 */
  .hd-shell-poem {
    color: var(--hd-ink-600);
    letter-spacing: 0.08em;
    text-shadow: 0 1px 2px rgba(245, 246, 244, 0.3);
  }

  /* 玄幻灵光粒子装饰 */
  .hd-shell-spirit {
    position: absolute;
    bottom: 18%;
    left: 48px;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .hd-spirit-particle {
    border-radius: var(--hd-radius-full);
    background: var(--hd-primary-300);
    opacity: 0.4;
  }

  .hd-spirit-particle--1 {
    width: 6px;
    height: 6px;
    animation: hd-float 6s ease-in-out infinite;
  }

  .hd-spirit-particle--2 {
    width: 4px;
    height: 4px;
    animation: hd-float 8s ease-in-out infinite 1s;
  }

  .hd-spirit-particle--3 {
    width: 5px;
    height: 5px;
    animation: hd-float 7s ease-in-out infinite 2.5s;
  }

  /* ================================================
     3. 表单区域占位 (z-index: 20, 右 40%)
     ================================================ */
  .hd-shell-form-area {
    position: relative;
    z-index: 20;
    flex: 0 0 40%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  /* ================================================
     4. 辅助层 (z-index: 10, 底部通栏)
     ================================================ */
  .hd-shell-footer {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 48px;
    background: linear-gradient(
      to top,
      rgba(28, 33, 40, 0.08) 0%,
      transparent 100%
    );
  }

  .hd-shell-footer-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hd-status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: var(--hd-radius-full);
    background: var(--state-success);
    animation: hd-pulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  .hd-shell-footer-text {
    color: var(--hd-ink-500);
  }

  .hd-shell-footer-version {
    color: var(--hd-ink-400);
  }

  .hd-shell-footer-copyright {
    color: var(--hd-ink-400);
  }

  /* ================================================
     动画
     ================================================ */
  @keyframes hd-breathe {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }

  @keyframes hd-drift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(30px); }
  }

  @keyframes hd-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes hd-float {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-12px); opacity: 0.7; }
  }

  /* ================================================
     响应式 — 平板 (≤1023px)：60/40 分栏 → 垂直堆叠
     ================================================ */
  @media (max-width: 1023px) {
    .hd-shell-main {
      flex-direction: column;
    }

    .hd-shell-brand {
      flex: 0 0 auto;
      width: 100%;
      min-height: 35vh;
      padding: 48px 24px;
    }

    .hd-shell-form-area {
      flex: 0 0 auto;
      width: 100%;
      min-height: 50vh;
      padding: 24px;
    }

    .hd-shell-footer {
      padding: 12px 24px;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .hd-seal {
      top: 24px;
      right: 24px;
    }

    .hd-shell-spirit {
      left: 24px;
    }
  }

  /* ================================================
     响应式 — 手机 (≤639px)：紧凑布局
     ================================================ */
  @media (max-width: 639px) {
    .hd-shell-brand {
      min-height: 30vh;
      padding: 32px 16px;
    }

    .hd-shell-form-area {
      min-height: 55vh;
      padding: 16px;
    }

    .hd-shell-footer {
      padding: 8px 16px;
      flex-direction: column;
      gap: 4px;
    }

    .hd-seal {
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      font-size: 13px;
    }

    .hd-shell-spirit {
      left: 16px;
      bottom: 12%;
    }
  }

  /* ================================================
     降级动画 — prefers-reduced-motion
     ================================================ */
  @media (prefers-reduced-motion: reduce) {
    .hd-shell-mist,
    .hd-shell-light--1,
    .hd-shell-light--2,
    .hd-shell-light--3,
    .hd-spirit-particle--1,
    .hd-spirit-particle--2,
    .hd-spirit-particle--3,
    .hd-status-dot {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>

<!-- ==================================================
     外壳 DOM 结构

  <div class="hd-shell-bg-layer">

    <div class="hd-shell-bg-overlay"></div>

    <div class="hd-shell-light hd-shell-light--1"></div>
    <div class="hd-shell-light hd-shell-light--2"></div>
    <div class="hd-shell-light hd-shell-light--3"></div>
  </div>

  <!-- 内容区：品牌意境区 + 表单区域占位 -->
  <div class="hd-shell-main">

    <!-- 2. 品牌意境区 (z-index: 10, 左 60%) -->
    <div class="hd-shell-brand">

      <h1 class="hd-display hd-shell-game-title">混沌世界</h1>

    <!-- 3. 表单区域占位 (z-index: 20, 右 40%) -->
    <div class="hd-shell-form-area">

    </div>

  </div>

  <!-- 4. 辅助层 (z-index: 10, 底部通栏) -->
  <div class="hd-shell-footer">

    <div class="hd-shell-footer-left">
      <span class="hd-status-dot" aria-hidden="true"></span>
      <span class="hd-body-sm hd-shell-footer-text">服务器：烽火连城 · 流畅</span>

    <!-- 版本号：居中 -->
    <span class="hd-body-sm hd-shell-footer-version">v1.0.0</span>
    <!-- 版权：右下 -->
    <span class="hd-body-sm hd-shell-footer-copyright">© 混沌世界</span>
  </div>

</div>
