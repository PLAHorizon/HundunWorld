# 混沌世界(HundunWorld) Prometheus配置
# 文档: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s       # 全局抓取间隔
  evaluation_interval: 15s   # 规则评估间隔
  scrape_timeout: 10s        # 抓取超时

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

# 加载告警规则文件
rule_files:
  - 'alert_rules.yml'

# 抓取目标配置
scrape_configs:
  # Orleans Silo指标
  - job_name: 'hundunworld-silo'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'silo-1:9464'
          - 'silo-2:9464'
          - 'silo-3:9464'
        labels:
          service: 'orleans-silo'
          environment: 'production'

  # 游戏网关指标
  - job_name: 'hundunworld-gateway'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'gateway-1:9465'
          - 'gateway-2:9465'
        labels:
          service: 'game-gateway'
          environment: 'production'

  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
