<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捏脸 - 风格选择</title>
    <style id="theme-vars">
/* ============================================================
   HundunWorld Character Creation - Game UI Brand CSS
   Overlay on Claude Design Library tokens.
   Primary: Teal (青黄+青兰混合)
   Secondary: Navy translucent (藏青半透明)
   Muted: Ink translucent (墨色半透明)
   Prefix: --game-
   ============================================================ */

:root {
  /* === Game Primary (Teal: 青黄+青兰混合) === */
  --game-primary: #2A9D8F;
  --game-primary-light: #4ECDC4;
  --game-primary-dark: #1B7A6E;
  --game-primary-glow: rgba(42, 157, 143, 0.3);
  --game-primary-rgb: 42, 157, 143;

  /* === Game Secondary (Navy Translucent: 藏青半透明) === */
  --game-secondary: rgba(25, 40, 80, 0.55);
  --game-secondary-light: rgba(35, 55, 100, 0.4);
  --game-secondary-solid: #1C2850;

  /* === Game Muted (Ink Translucent: 墨色半透明) === */
  --game-ink: rgba(10, 12, 18, 0.65);
  --game-ink-light: rgba(10, 12, 18, 0.4);
  --game-ink-subtle: rgba(10, 12, 18, 0.2);
  --game-ink-solid: #0A0C12;

  /* === Game Background System (Spring Dawn, light purple touch) === */
  --game-bg-darkest: #0F1018;
  --game-bg-dark: #161A24;
  --game-bg-panel: rgba(20, 22, 30, 0.78);
  --game-bg-panel-hover: rgba(30, 32, 44, 0.88);
  --game-bg-fog: rgba(200, 190, 180, 0.06);
  --game-bg-overlay: rgba(0, 0, 0, 0.4);
  --game-bg-jade-deep: #121520;
  --game-bg-jade-mid: #1C2230;
  --game-bg-jade-teal: #2A9D8F;
  --game-bg-jade-navy: #222838;
  --game-bg-jade-fog: #D0C8C0;
  --game-bg-jade-shimmer: rgba(42, 157, 143, 0.06);
  --game-bg-dawn-purple: #221830;
  --game-bg-dawn-violet: #5A4878;
  --game-bg-dawn-pink: #C8908A;
  --game-bg-dawn-teal: #2A9D8F;
  --game-bg-dawn-sky: #98A8B8;
  --game-bg-dawn-horizon: #D8C0B0;
  --game-bg-dawn-gold: #C8A870;
  --game-bg-dawn-warm: #E0C8A8;
  --game-bg-dawn-sunlight: #F0DDB0;
  --game-bg-dawn-sunray: rgba(240, 221, 176, 0.15);
  --game-bg-dawn-sunstrong: rgba(232, 208, 160, 0.25);

  /* === Game Text System === */
  --game-text-primary: #E8ECF0;
  --game-text-secondary: #8A95A5;
  --game-text-accent: #2A9D8F;
  --game-text-muted: #5A6575;
  --game-text-disabled: #3A4452;
  --game-text-white: #ffffff;
  --game-text-dark: #0C1018;

  /* === Game Font System === */
  --font-game-title: "STKaiti", "KaiTi", "Noto Serif SC", "SimSun", serif;
  --font-game-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;

  /* === Game Spacing (4px grid) === */
  --game-space-1: 4px;
  --game-space-2: 8px;
  --game-space-3: 12px;
  --game-space-4: 16px;
  --game-space-5: 20px;
  --game-space-6: 24px;
  --game-space-8: 32px;
  --game-space-10: 40px;
  --game-space-12: 48px;
  --game-space-16: 64px;

  /* === Game Radius === */
  --game-radius-sm: 4px;
  --game-radius-md: 8px;
  --game-radius-lg: 12px;
  --game-radius-full: 9999px;

  /* === Game Shadow System === */
  --game-shadow-panel: 0 4px 24px rgba(12, 16, 24, 0.5), inset 0 1px 0 rgba(42, 157, 143, 0.08);
  --game-shadow-glow: 0 0 20px rgba(42, 157, 143, 0.2);
  --game-shadow-button: 0 2px 8px rgba(12, 16, 24, 0.4);
  --game-shadow-dropdown: 0 8px 32px rgba(12, 16, 24, 0.6);

  /* === Game Border System === */
  --game-border-accent: 1px solid rgba(42, 157, 143, 0.2);
  --game-border-accent-active: 1px solid rgba(42, 157, 143, 0.5);
  --game-border-navy: 1px solid rgba(25, 40, 80, 0.4);
  --game-border-ink: 1px solid rgba(10, 12, 18, 0.5);
  --game-border-subtle: 1px solid rgba(42, 157, 143, 0.08);

  /* === Game Transition === */
  --game-transition-fast: 0.15s ease;
  --game-transition-normal: 0.3s ease;
  --game-transition-slow: 0.5s ease;

  /* === Game Control Heights === */
  --game-height-btn: 36px;
  --game-height-btn-lg: 44px;
  --game-height-slider: 3px;
  --game-height-slider-thumb: 14px;
  --game-height-tab: 48px;
  --game-height-topbar: 56px;
  --game-height-bottombar: 64px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--game-primary);
    --color-secondary: var(--game-secondary);
  }
  @layer base {
    body { background: var(--game-background); color: var(--game-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <div class="game-screen">

    <!-- ========== Top Navigation Bar ========== -->
    <nav class="topbar" role="navigation" aria-label="角色创建导航">
      <div class="topbar-left">
        <div class="topbar-search" role="button" aria-label="搜索" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <div class="topbar-tabs">
          <button class="topbar-tab topbar-tab--active" data-tab="sculpt">捏脸</button>
          <button class="topbar-tab topbar-tab--inactive" data-tab="ai">智能捏脸
            <span class="topbar-key-hint">E</span>
          </button>
        </div>
      </div>
      <div class="topbar-right">
        <span class="style-tag style-tag--active">武侠风</span>
        <span class="style-tag">经典</span>
        <span class="style-tag">奇幻</span>
      </div>
    </nav>

    <!-- ========== Left Panel ========== -->
    <aside class="left-panel" role="complementary" aria-label="风格选择面板">
      <div class="left-panel-title">风格选择</div>

      <!-- Style Capsule Toggle -->
      <div class="style-capsule" role="tablist" aria-label="面容风格">
        <button class="style-capsule-btn style-capsule-btn--active" data-style="elegant" role="tab" aria-selected="true">
          风雅
          <span class="capsule-key">Z</span>
        </button>
        <button class="style-capsule-btn" data-style="realistic" role="tab" aria-selected="false">
          写实
          <span class="capsule-key">C</span>
        </button>
      </div>

      <!-- Elegant Preset Grid (2x2) -->
      <div class="preset-grid" data-style-group="elegant">
        <div class="preset-card preset-card--selected" data-preset="warm-scholar" tabindex="0" role="button" aria-label="温润书生">
          <div class="preset-thumb preset-thumb--1">

                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>
              </svg>
            </div>
          </div>
          <div class="preset-label">温润书生</div>
        </div>
        <div class="preset-card" data-preset="young-general" tabindex="0" role="button" aria-label="英武少将">
          <div class="preset-thumb preset-thumb--2">
            <div class="preset-thumb-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>
              </svg>
            </div>
          </div>
          <div class="preset-label">英武少将</div>
        </div>
        <div class="preset-card" data-preset="weathered-hero" tabindex="0" role="button" aria-label="沧桑侠客">
          <div class="preset-thumb preset-thumb--3">
            <div class="preset-thumb-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>
              </svg>
            </div>
          </div>
          <div class="preset-label">沧桑侠客</div>
        </div>
        <div class="preset-card" data-preset="refined-sage" tabindex="0" role="button" aria-label="儒雅名士">

            <div class="preset-thumb-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>

            </div>
          </div>
          <div class="preset-label">儒雅名士</div>

      <!-- Realistic Preset Grid (hidden by default) -->
      <div class="preset-grid" data-style-group="realistic" style="display: none;">
        <div class="preset-card" data-preset="real-warrior" tabindex="0" role="button" aria-label="铁面武者">
          <div class="preset-thumb preset-thumb--5">
            <div class="preset-thumb-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>

            </div>
          </div>

        <div class="preset-card" data-preset="real-general" tabindex="0" role="button" aria-label="铁血将领">
          <div class="preset-thumb preset-thumb--6">
            <div class="preset-thumb-inner">

                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>

            </div>
          </div>

        </div>
        <div class="preset-card" data-preset="real-elder" tabindex="0" role="button" aria-label="苍老智者">
          <div class="preset-thumb preset-thumb--7">
            <div class="preset-thumb-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>
              </svg>
            </div>
          </div>
          <div class="preset-label">苍老智者</div>
        </div>
        <div class="preset-card" data-preset="real-wanderer" tabindex="0" role="button" aria-label="江湖浪人">
          <div class="preset-thumb preset-thumb--8">
            <div class="preset-thumb-inner">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="24" cy="16" r="8"/>
                <path d="M8 42c0-8.837 7.163-16 16-16s16 7.163 16 16"/>
              </svg>
            </div>
          </div>
          <div class="preset-label">江湖浪人</div>
        </div>
      </div>

      <!-- More Faces Button -->
      <button class="more-faces-btn more-faces-btn--pulse" data-action="more-faces">
        更多面容

          <polyline points="6 4 10 8 6 12"/>
        </svg>
      </button>
    </aside>

    <!-- ========== Center Preview Area ========== -->
    <main class="center-preview" role="main" aria-label="角色预览">
      <img class="face-preview" src="../assets/face-preview-male.jpg" alt="角色面部预览"

        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">

            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
        <span class="toolbar-btn-label">分享</span>

      <div class="toolbar-divider"></div>

      <!-- Clothing -->

        <button class="toolbar-btn" aria-label="服装" title="服装">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.38 3.46L16 2 12 5.27 8 2 3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
          </svg>
        </button>
        <span class="toolbar-btn-label">服装</span>
      </div>
      <!-- Headwear -->
      <div class="toolbar-btn-group">
        <button class="toolbar-btn" aria-label="头饰" title="头饰">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            <path d="M12 2c3 3 3 9 0 20"/>
            <path d="M12 2c-3 3-3 9 0 20"/>
            <path d="M2 12h20"/>
          </svg>
        </button>
        <span class="toolbar-btn-label">头饰</span>
      </div>
      <!-- Gesture -->
      <div class="toolbar-btn-group">
        <button class="toolbar-btn" aria-label="手势" title="手势">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-4 0v1"/>
            <path d="M14 10V4a2 2 0 0 0-4 0v6"/>
            <path d="M10 10.5V6a2 2 0 0 0-4 0v8"/>
            <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.83 0-5.35-1.74-6.36-4.38L3.07 12a2 2 0 0 1 3.86-1.06"/>

    <!-- ========== Bottom Bar (64px) ========== -->

            <polyline points="10 3 5 8 10 13"/>

      </div>
      <div class="bottombar-center">
        <button class="btn-outline" data-dom-id="btn-import-face" id="btnImportFace">
          <span class="btn-key">V</span>
          导入捏脸

      <div class="bottombar-right">
        <button class="btn-primary" data-dom-id="btn-next-style">

      </div>

    <div id="particles"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // === DOM References ===
      var capsuleBtns = document.querySelectorAll('.style-capsule-btn');
      var presetGroups = document.querySelectorAll('.preset-grid[data-style-group]');
      var presetCards = document.querySelectorAll('.preset-card');
      var importBtn = document.getElementById('btnImportFace');
      var topTabSculpt = document.querySelector('.topbar-tab[data-tab="sculpt"]');
      var topTabAI = document.querySelector('.topbar-tab[data-tab="ai"]');
      var styleTags = document.querySelectorAll('.style-tag');
      var moreFacesBtn = document.querySelector('.more-faces-btn');

      // === State ===
      var currentStyle = 'elegant';
      var currentPreset = 'warm-scholar';

      // === Style Capsule Tab Switching ===
      function setStyle(style) {
        currentStyle = style;

        capsuleBtns.forEach(function (btn) {
          var isActive = btn.getAttribute('data-style') === style;
          btn.classList.toggle('style-capsule-btn--active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        presetGroups.forEach(function (group) {
          var matches = group.getAttribute('data-style-group') === style;
          group.style.display = matches ? 'grid' : 'none';
        });

        // Reset selection in the new group
        var activeGroup = document.querySelector('.preset-grid[data-style-group="' + style + '"]');
        if (activeGroup) {
          var firstCard = activeGroup.querySelector('.preset-card');
          if (firstCard) {
            selectPreset(firstCard);
          }
        }
      }

      capsuleBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          setStyle(btn.getAttribute('data-style'));
        });
      });

      // === Preset Selection ===
      function selectPreset(card) {
        presetCards.forEach(function (c) {
          c.classList.remove('preset-card--selected');
        });
        card.classList.add('preset-card--selected');
        currentPreset = card.getAttribute('data-preset');
      }

      presetCards.forEach(function (card) {
        card.addEventListener('click', function () {
          selectPreset(card);
        });
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectPreset(card);
          }
        });
      });

      // === Keyboard Shortcuts ===
      document.addEventListener('keydown', function (e) {
        var key = e.key.toLowerCase();

        // Z = Elegant, C = Realistic
        if (key === 'z') {
          e.preventDefault();
          setStyle('elegant');
        } else if (key === 'c') {
          e.preventDefault();
          setStyle('realistic');
        }

        // V = Import
        if (key === 'v') {
          e.preventDefault();
          triggerImportFlash();
        }
      });

      // === Import Button Flash ===
      function triggerImportFlash() {
        importBtn.classList.remove('btn-outline--flash');
        void importBtn.offsetWidth;
        importBtn.classList.add('btn-outline--flash');

        importBtn.addEventListener('animationend', function handler() {
          importBtn.classList.remove('btn-outline--flash');
          importBtn.removeEventListener('animationend', handler);
        });
      }

      importBtn.addEventListener('click', function () {
        triggerImportFlash();
      });

      // === Top Tab Switching (visual only) ===
      topTabSculpt.addEventListener('click', function () {
        topTabSculpt.classList.add('topbar-tab--active');
        topTabSculpt.classList.remove('topbar-tab--inactive');
        topTabAI.classList.add('topbar-tab--inactive');
        topTabAI.classList.remove('topbar-tab--active');
      });

      topTabAI.addEventListener('click', function () {
        topTabAI.classList.add('topbar-tab--active');
        topTabAI.classList.remove('topbar-tab--inactive');
        topTabSculpt.classList.add('topbar-tab--inactive');
        topTabSculpt.classList.remove('topbar-tab--active');
      });

      // === Style Tags Toggle ===
      styleTags.forEach(function (tag) {
        tag.addEventListener('click', function () {
          styleTags.forEach(function (t) {
            t.classList.remove('style-tag--active');
          });
          tag.classList.add('style-tag--active');
        });
      });

      // === More Faces Pulse ===
      moreFacesBtn.addEventListener('click', function () {
        moreFacesBtn.classList.remove('more-faces-btn--pulse');
        setTimeout(function () {
          moreFacesBtn.classList.add('more-faces-btn--pulse');
        }, 3000);
      });

      // === Initialize ===
      setStyle('elegant');

    })();
