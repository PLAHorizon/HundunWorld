<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Horizon Game GengDi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style id="theme-vars">
:root {
  --primary: #5C7A3A;
  --primary-foreground: #ffffff;
  --primary-hover: #6E8E4A;
  --primary-glow: rgba(92, 122, 58, 0.3);
  --card: #0C2D48;
  --card-foreground: #E8F0F8;
  --muted-foreground: #8BA4BC;
  --secondary: #4A90D9;
  --secondary-foreground: #ffffff;
  --accent: #0C2D48;
  --destructive: #ef4444;
  --text-50: #0A1F33;
  --text-400: #6B8DA8;
  --text-500: #8BA4BC;
  --text-800: #D0DFF0;
  --text-900: #EAF2FA;
  --bg-50: #071826;
  --bg-100: #0C2D48;
  --bg-300: #163A5C;
  --bg-500: #1E4A6E;
  --border-200: #2A5070;
  --border-400: #4A7A9C;
  --border-500: #5C7A3A;
  --icon-400: #6B8DA8;
  --icon-900: #ffffff;
  --radius-small: 8px;
  --radius-medium: 12px;
  --radius-large: 16px;
  --sky-blue: #4A90D9;
  --deep-blue: #0C2D48;
  --army-green: #5C7A3A;
  --army-green-light: #6E8E4A;
  --info-card-bg: rgba(12, 45, 72, 0.75);
  --info-card-border: rgba(74, 144, 217, 0.12);
  --icon-bg-sky: rgba(74, 144, 217, 0.15);
  --icon-bg-green: rgba(92, 122, 58, 0.15);
  --input-bg: rgba(7, 24, 38, 0.6);
  --input-focus-glow: rgba(92, 122, 58, 0.15);
  --logo-shadow: rgba(92, 122, 58, 0.35);
  --hero-overlay: linear-gradient(to bottom, rgba(7, 24, 38, 0.15) 0%, rgba(7, 24, 38, 0) 30%, rgba(7, 24, 38, 0) 60%, rgba(7, 24, 38, 0.2) 100%);
  --sun-glow-1: radial-gradient(circle, rgba(255, 140, 50, 0.05) 0%, rgba(255, 100, 30, 0.02) 40%, transparent 70%);
  --sun-glow-2: radial-gradient(circle, rgba(255, 170, 60, 0.1) 0%, rgba(255, 120, 40, 0.04) 50%, transparent 75%);
  --sun-body: radial-gradient(circle, rgba(255, 200, 80, 0.45) 0%, rgba(255, 150, 50, 0.2) 40%, rgba(255, 100, 30, 0.06) 70%, transparent 100%);
  --sun-core: radial-gradient(circle, rgba(255, 240, 200, 0.5) 0%, rgba(255, 200, 100, 0.2) 50%, transparent 100%);
  --sun-shine-1: linear-gradient(90deg, transparent 0%, rgba(255, 180, 80, 0.06) 20%, rgba(255, 200, 120, 0.1) 50%, rgba(255, 180, 80, 0.06) 80%, transparent 100%);
  --sun-shine-2: linear-gradient(90deg, transparent 0%, rgba(255, 160, 60, 0.04) 25%, rgba(255, 180, 100, 0.08) 50%, rgba(255, 160, 60, 0.04) 75%, transparent 100%);
  --particle-1: rgba(255, 140, 50, 0.5);
  --particle-2: rgba(255, 180, 80, 0.4);
  --particle-3: rgba(255, 120, 40, 0.35);
  --particle-4: rgba(255, 200, 100, 0.3);
  --particle-5: rgba(255, 160, 60, 0.3);
  --particle-6: rgba(255, 140, 50, 0.35);
  --particle-7: rgba(255, 180, 80, 0.45);
  --highlight-w: rgba(255, 255, 255, 0.08);
  --rocket-silver: rgba(255, 255, 255, 0.06);
  --wave-fill-1: rgba(74, 144, 217, 0.1);
  --wave-fill-2: rgba(74, 144, 217, 0.12);
  --wave-fill-3: rgba(74, 144, 217, 0.15);
  --wave-shine: rgba(74, 144, 217, 0.3);
  --wave-shine-2: rgba(74, 144, 217, 0.25);
  --wave-shine-green: rgba(92, 122, 58, 0.2);
  --sun-shadow-1: rgba(255, 140, 50, 0.15);
  --sun-shadow-2: rgba(255, 100, 30, 0.06);
  --sun-shadow: 0 0 80px var(--sun-shadow-1), 0 0 160px var(--sun-shadow-2);
  --wave-grad-end: rgba(12, 45, 72, 0.25);
  --wave-shine-3: rgba(74, 144, 217, 0.2);
  --rocket-green-low: rgba(92, 122, 58, 0.5);
  --rocket-green-med: rgba(92, 122, 58, 0.4);
  --rocket-flag-red: #DE2910;
  --rocket-flag-star: #FFDE00;
  --rocket-body-edge: #7A9AA8;
  --rocket-body-light: #D8E8F0;
  --rocket-body-bright: #E8F2F8;
  --rocket-body-mid: #D0DFF0;
  --rocket-booster-edge: #6B8DA0;
  --rocket-booster-light: #C8D8E4;
  --rocket-fairing-dark: #A0B8C8;
  --rocket-flame-orange: #FF8C32;
  --rocket-flame-red: #FF6020;
  --rocket-flame-yellow: #FFD060;
  --rocket-flame-core: #FFF8E0;
  --rocket-flame-mid: #FF9040;
  --rocket-interstage: #5C7A6A;
  --rocket-fin: #6B8DA8;
  --rocket-nozzle: #4A6A80;
  --rocket-nozzle-inner: #3A5A70;
  --rocket-interstage-dark: #4A6A5A;
  --rocket-fairing-tip: #C0D4E0;
  --rocket-stage: rgba(92, 122, 58, 0.6);
  --rocket-stage-2: rgba(92, 122, 58, 0.5);
  --rocket-stage-3: rgba(92, 122, 58, 0.3);
  --rocket-metal-dark: rgba(74, 74, 74, 0.5);
  --rocket-panel-light: rgba(255, 255, 255, 0.1);
  --rocket-panel-dark: rgba(255, 255, 255, 0.06);
  --hero-start: #071826;
  --hero-mid: #0C2D48;
  --hero-end: #163A5C;
}
    </style>
    <style type="text/tailwindcss">
@theme inline {
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-muted-foreground: var(--muted-foreground);
    --color-destructive: var(--destructive);
    --color-border: var(--border-400);
    --radius-sm: var(--radius-small);
    --radius-md: var(--radius-medium);
    --radius-lg: var(--radius-large);
}
@layer base {
    body { background: var(--bg-50); color: var(--text-900); font-family: 'Poppins', sans-serif; }
}
    </style>
</head>
<body class="min-h-screen font-sans antialiased overflow-hidden">
    <main class="flex h-screen w-[1440px] mx-auto" style="height: 900px;">

        <!-- LEFT: Hero Area -->
        <div class="relative flex-1 flex flex-col items-center justify-center px-16 overflow-hidden" style="background: var(--bg-50);">
            <!-- 武侠背景氛围 -->
            <div class="absolute inset-0" style="background: url('../assets/wuxia-atmosphere.jpg') center / cover no-repeat; opacity: 0.75;"></div>
            <div class="absolute inset-0" style="background: var(--hero-overlay);"></div>

            <!-- ====== Scene Layer ====== -->

            <!-- 旭日东升 - 上方偏中 (红金虚化) -->
            <div class="absolute pointer-events-none" style="top: 8%; left: 50%; transform: translateX(-50%);">
                <!-- 大范围红金光晕 - 最外层 -->
                <div class="absolute rounded-full" style="width: 500px; height: 500px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--sun-glow-1); filter: blur(30px); animation: sun-glow 6s ease-in-out infinite;"></div>
                <!-- 中层暖光 -->
                <div class="absolute rounded-full" style="width: 280px; height: 280px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--sun-glow-2); filter: blur(18px); animation: sun-glow 4s ease-in-out infinite 1s;"></div>
                <!-- 太阳虚化本体 -->
                <div class="absolute rounded-full" style="width: 100px; height: 100px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--sun-body); filter: blur(14px); box-shadow: var(--sun-shadow);"></div>
                <!-- 太阳核心高光 -->
                <div class="absolute rounded-full" style="width: 40px; height: 40px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--sun-core); filter: blur(8px);"></div>
                <!-- 水平光带 (旭日效果) -->
                <div class="absolute" style="width: 600px; height: 4px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--sun-shine-1); filter: blur(4px);"></div>
                <div class="absolute" style="width: 700px; height: 3px; top: calc(50% + 8px); left: 50%; transform: translate(-50%, -50%); background: var(--sun-shine-2); filter: blur(5px);"></div>
            </div>

            <!-- 三级捆绑运载火箭升空 - 中部偏左 -->
            <svg class="absolute pointer-events-none" style="left: 14%; bottom: 15%; width: 130px; height: 450px; animation: rocket-rise 6s ease-in-out infinite;" viewBox="0 0 130 450">
                <defs>
                    <linearGradient id="rocket-body" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="var(--rocket-body-edge)" />
                        <stop offset="25%" stop-color="var(--rocket-body-light)" />
                        <stop offset="50%" stop-color="var(--rocket-body-bright)" />
                        <stop offset="75%" stop-color="var(--rocket-body-mid)" />
                        <stop offset="100%" stop-color="var(--rocket-body-edge)" />
                    </linearGradient>
                    <linearGradient id="booster-body" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="var(--rocket-booster-edge)" />
                        <stop offset="50%" stop-color="var(--rocket-booster-light)" />
                        <stop offset="100%" stop-color="var(--rocket-booster-edge)" />
                    </linearGradient>
                    <linearGradient id="fairing" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="var(--rocket-body-bright)" />
                        <stop offset="100%" stop-color="var(--rocket-fairing-dark)" />
                    </linearGradient>
                    <linearGradient id="flame-outer" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--rocket-flame-orange)" />
                        <stop offset="40%" stop-color="var(--rocket-flame-red)" />
                        <stop offset="100%" stop-color="transparent" />
                    </linearGradient>
                    <linearGradient id="flame-inner" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--rocket-flame-yellow)" />
                        <stop offset="50%" stop-color="var(--rocket-flame-mid)" />
                        <stop offset="100%" stop-color="transparent" />
                    </linearGradient>
                    <linearGradient id="flame-core" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--rocket-flame-core)" />
                        <stop offset="100%" stop-color="var(--rocket-flame-yellow)" />
                    </linearGradient>
                    <linearGradient id="booster-flame" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--rocket-flame-mid)" />
                        <stop offset="60%" stop-color="var(--rocket-flame-red)" />
                        <stop offset="100%" stop-color="transparent" />
                    </linearGradient>
                </defs>

                <!-- ========== 尾焰 (底层) ========== -->
                <!-- 左助推器尾焰 (从助推器底部外侧向外偏移) -->
                <path fill="url(#booster-flame)" opacity="0.45">
                    <animate attributeName="d" values="M18 367 Q24 400 20 450 L28 450 Q24 400 30 367;M17 367 Q24 405 19 450 L29 450 Q24 405 31 367;M18 367 Q24 400 20 450 L28 450 Q24 400 30 367" dur="0.2s" repeatCount="indefinite"/>
                </path>
                <!-- 右助推器尾焰 (从助推器底部外侧向外偏移) -->
                <path fill="url(#booster-flame)" opacity="0.45">
                    <animate attributeName="d" values="M100 367 Q106 400 102 450 L110 450 Q106 400 112 367;M99 367 Q106 405 101 450 L111 450 Q106 405 113 367;M100 367 Q106 400 102 450 L110 450 Q106 400 112 367" dur="0.22s" repeatCount="indefinite"/>
                </path>
                <!-- 芯级尾焰外层 (从喷口向下) -->
                <path fill="url(#flame-outer)" opacity="0.45">
                    <animate attributeName="d" values="M50 332 Q65 385 58 450 L72 450 Q65 385 80 332;M48 332 Q65 390 56 450 L74 450 Q65 390 82 332;M50 332 Q65 385 58 450 L72 450 Q65 385 80 332" dur="0.25s" repeatCount="indefinite"/>
                </path>
                <!-- 芯级尾焰中层 -->
                <path fill="url(#flame-inner)" opacity="0.6">
                    <animate attributeName="d" values="M55 332 Q65 375 59 435 L71 435 Q65 375 75 332;M54 332 Q65 380 58 435 L72 435 Q65 380 76 332;M55 332 Q65 375 59 435 L71 435 Q65 375 75 332" dur="0.2s" repeatCount="indefinite"/>
                </path>
                <!-- 芯级尾焰核心 -->
                <path fill="url(#flame-core)" opacity="0.7">
                    <animate attributeName="d" values="M59 332 Q65 365 61 420 L69 420 Q65 365 71 332;M58 332 Q65 370 60 420 L70 420 Q65 370 72 332;M59 332 Q65 365 61 420 L69 420 Q65 365 71 332" dur="0.15s" repeatCount="indefinite"/>
                </path>

                <!-- ========== 助推器 ========== -->
                <!-- 捆绑连接结构 -->
                <rect x="42" y="240" width="4" height="10" rx="1" fill="var(--rocket-interstage)"/>
                <rect x="42" y="310" width="4" height="10" rx="1" fill="var(--rocket-interstage)"/>
                <rect x="84" y="240" width="4" height="10" rx="1" fill="var(--rocket-interstage)"/>
                <rect x="84" y="310" width="4" height="10" rx="1" fill="var(--rocket-interstage)"/>

                <!-- 左助推器 (y 230~365, 长135) -->
                <rect x="14" y="230" width="20" height="135" rx="4" fill="url(#booster-body)"/>
                <path d="M14 234 L24 210 L34 234 Z" fill="var(--army-green)"/>
                <path d="M14 355 L6 380 L14 365 Z" fill="var(--rocket-fin)" opacity="0.8"/>
                <path d="M34 355 L42 380 L34 365 Z" fill="var(--rocket-fin)" opacity="0.8"/>
                <ellipse cx="24" cy="365" rx="8" ry="3" fill="var(--rocket-nozzle)"/>
                <path d="M17 363 L24 373 L31 363 Z" fill="var(--rocket-nozzle-inner)"/>

                <!-- 右助推器 -->
                <rect x="96" y="230" width="20" height="135" rx="4" fill="url(#booster-body)"/>
                <path d="M96 234 L106 210 L116 234 Z" fill="var(--army-green)"/>
                <path d="M96 355 L88 380 L96 365 Z" fill="var(--rocket-fin)" opacity="0.8"/>
                <path d="M116 355 L124 380 L116 365 Z" fill="var(--rocket-fin)" opacity="0.8"/>
                <ellipse cx="106" cy="365" rx="8" ry="3" fill="var(--rocket-nozzle)"/>
                <path d="M99 363 L106 373 L113 363 Z" fill="var(--rocket-nozzle-inner)"/>

                <!-- ========== 芯一级 (y 235~330, 长95) ========== -->
                <rect x="44" y="235" width="42" height="95" rx="5" fill="url(#rocket-body)"/>
                <rect x="50" y="275" width="30" height="3" fill="var(--army-green)" opacity="0.5" rx="1"/>
                <path d="M44 318 L30 350 L44 335 Z" fill="var(--rocket-fin)" opacity="0.9"/>
                <path d="M86 318 L100 350 L86 335 Z" fill="var(--rocket-fin)" opacity="0.9"/>
                <ellipse cx="65" cy="330" rx="16" ry="4" fill="var(--rocket-nozzle)"/>
                <path d="M47 326 L65 340 L83 326 Z" fill="var(--rocket-nozzle-inner)"/>

                <!-- ========== 级间段 1-2 ========== -->
                <rect x="42" y="222" width="46" height="15" rx="4" fill="var(--rocket-interstage)"/>
                <rect x="42" y="228" width="46" height="2" fill="var(--rocket-interstage-dark)" opacity="0.6"/>

                <!-- ========== 芯二级 (y 110~224, 长114, 2倍) ========== -->
                <rect x="48" y="110" width="34" height="114" rx="4" fill="url(#rocket-body)"/>
                <rect x="54" y="170" width="22" height="2" fill="var(--army-green)" opacity="0.4" rx="1"/>
                <rect x="54" y="200" width="22" height="2" fill="var(--army-green)" opacity="0.3" rx="1"/>

                <!-- ========== 级间段 2-3 ========== -->
                <rect x="46" y="100" width="38" height="12" rx="3" fill="var(--rocket-interstage)"/>
                <rect x="46" y="106" width="38" height="2" fill="var(--rocket-interstage-dark)" opacity="0.6"/>

                <!-- ========== 芯三级 (y 68~102, 长34) ========== -->
                <rect x="52" y="68" width="26" height="34" rx="4" fill="url(#rocket-body)"/>

                <!-- ========== 整流罩 (东风-5D 风格: 长锐锥形, 顶部小圆收口) ========== -->
                <!-- 整流罩主体 - 长锥从宽(26px)缓慢收到窄(10px), 顶部小圆弧 -->
                <path d="M52 70 L55 50 Q58 30 62 18 Q64 10 65 6 Q66 10 68 18 Q72 30 75 50 L78 70 Z" fill="url(#fairing)" />
                <!-- 顶部小圆润收口 -->
                <ellipse cx="65" cy="7" rx="3" ry="4" fill="var(--rocket-fairing-tip)"/>
                <!-- 整流罩分割线 -->
                <line x1="65" y1="11" x2="65" y2="70" stroke="var(--rocket-body-edge)" stroke-width="0.6" opacity="0.3"/>
                <!-- 整流罩左高光 -->
                <path d="M53 65 Q54 45 58 25" stroke="var(--highlight-w)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                <!-- ========== 中华人民共和国国旗 ========== -->
                <g transform="translate(53, 74)">
                    <rect x="0" y="0" width="24" height="16" rx="1" fill="var(--rocket-flag-red)"/>
                    <polygon points="5,3 5.8,5.5 8.5,5.8 6.3,7.5 7,10 5,8.5 3,10 3.7,7.5 1.5,5.8 4.2,5.5" fill="var(--rocket-flag-star)"/>
                    <polygon points="10.5,1.5 10.9,2.8 12.2,3 11.2,3.8 11.5,5 10.5,4.3 9.5,5 9.8,3.8 8.8,3 10.1,2.8" fill="var(--rocket-flag-star)"/>
                    <polygon points="12,4 12.4,5.2 13.5,5.4 12.7,6.1 12.9,7.2 12,6.5 11.1,7.2 11.3,6.1 10.5,5.4 11.6,5.2" fill="var(--rocket-flag-star)"/>
                    <polygon points="12,7 12.3,7.8 13.2,7.9 12.5,8.4 12.6,9.3 12,8.8 11.4,9.3 11.5,8.4 10.8,7.9 11.7,7.8" fill="var(--rocket-flag-star)"/>
                    <polygon points="10.5,9.5 10.8,10.3 11.7,10.5 11,11 11.2,11.8 10.5,11.3 9.8,11.8 10,11 9.3,10.5 10.2,10.3" fill="var(--rocket-flag-star)"/>
                </g>
            </svg>
            <!-- 火箭尾迹粒子 (3倍量, 从三个尾焰口散射) -->
            <div class="absolute pointer-events-none" style="left: calc(14% + 18px); bottom: 12%; width: 20px;">
                <!-- 左助推器尾迹 -->
                <div style="position:absolute; width:5px; height:5px; border-radius:50%; background:var(--particle-1); animation:trail-particle 1.8s ease-out infinite; filter:blur(1px);"></div>
                <div style="position:absolute; width:4px; height:4px; border-radius:50%; background:var(--particle-2); animation:trail-particle 2s ease-out infinite 0.3s; left:6px;"></div>
                <div style="position:absolute; width:6px; height:6px; border-radius:50%; background:var(--particle-3); animation:trail-particle 1.6s ease-out infinite 0.7s; left:-3px;"></div>
                <div style="position:absolute; width:3px; height:3px; border-radius:50%; background:var(--particle-4); animation:trail-particle 2.2s ease-out infinite 1s; left:10px;"></div>
            </div>
            <div class="absolute pointer-events-none" style="left: calc(14% + 55px); bottom: 10%; width: 30px;">
                <!-- 芯级尾迹 (最多) -->
                <div style="position:absolute; width:6px; height:6px; border-radius:50%; background:var(--particle-1); animation:trail-particle 1.5s ease-out infinite; filter:blur(1px);"></div>
                <div style="position:absolute; width:5px; height:5px; border-radius:50%; background:var(--particle-7); animation:trail-particle 1.7s ease-out infinite 0.2s; left:8px;"></div>
                <div style="position:absolute; width:7px; height:7px; border-radius:50%; background:var(--particle-3); animation:trail-particle 1.4s ease-out infinite 0.4s; left:-4px;"></div>
                <div style="position:absolute; width:4px; height:4px; border-radius:50%; background:var(--particle-2); animation:trail-particle 1.6s ease-out infinite 0.6s; left:14px;"></div>
                <div style="position:absolute; width:5px; height:5px; border-radius:50%; background:var(--particle-5); animation:trail-particle 1.9s ease-out infinite 0.8s; left:-8px;"></div>
                <div style="position:absolute; width:3px; height:3px; border-radius:50%; background:var(--particle-6); animation:trail-particle 2.1s ease-out infinite 1s; left:18px;"></div>
            </div>
            <div class="absolute pointer-events-none" style="left: calc(14% + 92px); bottom: 12%; width: 20px;">
                <!-- 右助推器尾迹 -->
                <div style="position:absolute; width:5px; height:5px; border-radius:50%; background:var(--particle-1); animation:trail-particle 1.8s ease-out infinite 0.1s; filter:blur(1px);"></div>
                <div style="position:absolute; width:4px; height:4px; border-radius:50%; background:var(--particle-2); animation:trail-particle 2s ease-out infinite 0.5s; left:5px;"></div>
                <div style="position:absolute; width:6px; height:6px; border-radius:50%; background:var(--particle-5); animation:trail-particle 1.6s ease-out infinite 0.9s; left:-2px;"></div>
                <div style="position:absolute; width:3px; height:3px; border-radius:50%; background:var(--particle-2); animation:trail-particle 2.2s ease-out infinite 1.3s; left:10px;"></div>
            </div>

            <!-- 海波荡漾 - 底部 -->
            <svg class="absolute bottom-0 left-0 w-full pointer-events-none" style="height: 120px;" viewBox="0 0 1000 120" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="wave-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--wave-fill-3)" />
                        <stop offset="100%" stop-color="var(--wave-grad-end)" />
                    </linearGradient>
                </defs>
                <!-- 波浪层 1 - 最远 -->
                <path fill="var(--wave-fill-1)">
                    <animate attributeName="d" values="M0 60 Q125 30 250 55 T500 45 T750 55 T1000 40 L1000 120 L0 120 Z;M0 55 Q125 40 250 50 T500 60 T750 45 T1000 55 L1000 120 L0 120 Z;M0 60 Q125 30 250 55 T500 45 T750 55 T1000 40 L1000 120 L0 120 Z" dur="5s" repeatCount="indefinite"/>
                </path>
                <!-- 波浪层 2 -->
                <path fill="var(--wave-fill-2)">
                    <animate attributeName="d" values="M0 70 Q150 45 300 65 T600 55 T900 65 T1000 50 L1000 120 L0 120 Z;M0 65 Q150 55 300 60 T600 70 T900 55 T1000 65 L1000 120 L0 120 Z;M0 70 Q150 45 300 65 T600 55 T900 65 T1000 50 L1000 120 L0 120 Z" dur="4s" repeatCount="indefinite"/>
                </path>
                <!-- 波浪层 3 - 最近最深 -->
                <path fill="url(#wave-grad)">
                    <animate attributeName="d" values="M0 80 Q200 60 400 75 T800 65 T1000 70 L1000 120 L0 120 Z;M0 75 Q200 70 400 65 T800 75 T1000 68 L1000 120 L0 120 Z;M0 80 Q200 60 400 75 T800 65 T1000 70 L1000 120 L0 120 Z" dur="3.5s" repeatCount="indefinite"/>
                </path>
                <!-- 波光点缀 -->
                <circle cx="200" cy="85" r="1.5" fill="var(--wave-shine)">
                    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="450" cy="78" r="1" fill="var(--wave-shine-2)">
                    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
                </circle>
                <circle cx="700" cy="82" r="1.5" fill="var(--wave-shine)">
                    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite" begin="1s"/>
                </circle>
                <circle cx="350" cy="90" r="1" fill="var(--wave-shine-green)">
                    <animate attributeName="opacity" values="0.05;0.25;0.05" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
                </circle>
                <circle cx="850" cy="88" r="1.2" fill="var(--wave-shine-3)">
                    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
                </circle>
            </svg>

            <!-- Logo -->
            <div class="w-[72px] h-[72px] rounded-full flex items-center justify-center mb-6 relative z-10 overflow-hidden" style="background: var(--army-green); box-shadow: 0 8px 32px var(--logo-shadow);">
                <img src="../assets/white-dove.jpg" alt="白鸽" style="width: 54px; height: 54px; object-fit: cover; border-radius: 4px;" />
            </div>

            <!-- App Name -->
            <h1 class="text-[36px] font-bold leading-tight mb-3 relative z-10" style="background: linear-gradient(135deg, var(--text-900) 0%, var(--sky-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                元阳游戏方舟
            </h1>
            <p class="text-base font-light tracking-wide mb-14 relative z-10" style="color: var(--text-500);">
                探索无限可能的游戏世界
            </p>

            <!-- Info Cards Row -->
            <div class="flex gap-5 relative z-10">
                <!-- Weather Card -->
                <div class="rounded-xl w-[220px] h-[136px] p-5 flex flex-col transition-all duration-300" style="background: var(--info-card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--info-card-border);">
                    <div class="flex items-center gap-2.5 mb-3">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background: var(--icon-bg-sky);">
                            <i data-lucide="cloud-sun" class="w-[18px] h-[18px]" style="color: var(--sky-blue);"></i>
                        </div>
                        <span class="text-sm font-medium" style="color: var(--text-800);">天气预报</span>
                    </div>
                    <div class="flex-1 flex items-end justify-between">
                        <div>
                            <p class="text-[28px] font-semibold leading-none" style="color: var(--text-900);">26°C</p>
                            <p class="text-xs mt-1" style="color: var(--text-500);">多云转晴</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs" style="color: var(--text-500);">湿度 62%</p>
                            <p class="text-xs mt-0.5" style="color: var(--text-400);">北京</p>
                        </div>
                    </div>
                </div>

                <!-- Flower Card -->
                <div class="rounded-xl w-[220px] h-[136px] p-5 flex flex-col transition-all duration-300" style="background: var(--info-card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--info-card-border);">
                    <div class="flex items-center gap-2.5 mb-3">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background: var(--icon-bg-green);">
                            <i data-lucide="flower-2" class="w-[18px] h-[18px]" style="color: var(--army-green-light);"></i>
                        </div>
                        <span class="text-sm font-medium" style="color: var(--text-800);">花卉推荐</span>
                    </div>
                    <div class="flex-1 flex items-end justify-between">
                        <div>
                            <p class="text-[28px] font-semibold leading-none" style="color: var(--text-900);">向日葵</p>
                            <p class="text-xs mt-1" style="color: var(--text-500);">今日推荐</p>
                        </div>
                        <div class="flex gap-1">
                            <span class="text-lg">🌻</span>
                        </div>
                    </div>
                </div>

                <!-- Game Card -->
                <div class="rounded-xl w-[220px] h-[136px] p-5 flex flex-col transition-all duration-300" style="background: var(--info-card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--info-card-border);">
                    <div class="flex items-center gap-2.5 mb-3">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background: var(--icon-bg-green);">
                            <i data-lucide="gamepad-2" class="w-[18px] h-[18px]" style="color: var(--army-green-light);"></i>
                        </div>
                        <span class="text-sm font-medium" style="color: var(--text-800);">推荐游戏</span>
                    </div>
                    <div class="flex-1 flex items-end justify-between">
                        <div>
                            <p class="text-[28px] font-semibold leading-none" style="color: var(--text-900);">荒野大镖客</p>
                            <p class="text-xs mt-1" style="color: var(--text-500);">9.2 分好评</p>
                        </div>
                        <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: var(--icon-bg-green);">
                            <i data-lucide="arrow-right" class="w-4 h-4" style="color: var(--army-green);"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- RIGHT: Login Form -->
        <div class="w-[440px] flex-shrink-0 flex items-center justify-center px-12 relative" style="background: var(--card);">
            <div class="w-full max-w-[360px]">
                <!-- Title -->
                <h2 class="text-[30px] font-bold mb-2 leading-tight" style="color: var(--text-800);">登录</h2>
                <p class="text-sm mb-9 leading-relaxed" style="color: var(--text-500);">使用已注册账户进入客户端</p>

                <!-- Form -->
                <form onsubmit="return false;" class="space-y-5">
                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-800);">用户名</label>
                        <div class="relative">
                            <div class="absolute left-3.5 top-1/2 -translate-y-1/2">
                                <i data-lucide="user" class="w-[18px] h-[18px]" style="color: var(--text-400);"></i>
                            </div>
                            <input
                                type="text"
                                placeholder="请输入用户名"
                                class="w-full rounded-xl pl-11 pr-4 py-3 text-sm transition-colors duration-200"
                                style="background: var(--input-bg); border: 1px solid var(--border-200); color: var(--text-900); outline: none;"
                                onfocus="this.style.borderColor='var(--army-green)'; this.style.boxShadow='0 0 0 3px var(--input-focus-glow)';"
                                onblur="this.style.borderColor='var(--border-200)'; this.style.boxShadow='none';"
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-800);">密码</label>
                        <div class="relative">
                            <div class="absolute left-3.5 top-1/2 -translate-y-1/2">
                                <i data-lucide="lock" class="w-[18px] h-[18px]" style="color: var(--text-400);"></i>
                            </div>
                            <input
                                type="password"
                                placeholder="请输入密码"
                                class="w-full rounded-xl pl-11 pr-11 py-3 text-sm transition-colors duration-200"
                                style="background: var(--input-bg); border: 1px solid var(--border-200); color: var(--text-900); outline: none;"
                                onfocus="this.style.borderColor='var(--army-green)'; this.style.boxShadow='0 0 0 3px var(--input-focus-glow)';"
                                onblur="this.style.borderColor='var(--border-200)'; this.style.boxShadow='none';"
                                autocomplete="current-password"
                            />
                            <button type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 cursor-pointer bg-transparent border-none p-0">
                                <i data-lucide="eye-off" class="w-[18px] h-[18px]" style="color: var(--text-400);"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember me -->
                    <div class="flex items-center gap-2.5">
                        <input type="checkbox" class="w-[18px] h-[18px] rounded cursor-pointer" id="remember" style="accent-color: var(--army-green);" />
                        <label for="remember" class="text-sm cursor-pointer select-none" style="color: var(--text-500);">记住登录信息</label>
                    </div>

                    <!-- Error message (hidden by default) -->
                    <div class="text-[13px] min-h-[20px] flex items-center gap-1.5 invisible" id="errorMsg" style="color: var(--destructive);">
                        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                        <span>用户名或密码错误，请重试</span>
                    </div>

                    <!-- Primary Button -->
                    <button type="submit" class="w-full py-3 rounded-xl text-sm font-semibold cursor-pointer border-none transition-all duration-200" style="background: var(--army-green); color: var(--primary-foreground);"
                        onmouseover="this.style.background='var(--army-green-light)'; this.style.boxShadow='0 4px 20px var(--logo-shadow)';"
                        onmouseout="this.style.background='var(--army-green)'; this.style.boxShadow='none';">
                        登录
                    </button>

                    <!-- Secondary Button -->
                    <button type="button" class="w-full py-3 rounded-xl text-sm font-medium cursor-pointer transition-all duration-200" style="background: transparent; border: 1px solid var(--border-400); color: var(--text-500);"
                        onmouseover="this.style.borderColor='var(--sky-blue)'; this.style.color='var(--text-800)'; this.style.background='var(--secondary-hover-bg)';"
                        onmouseout="this.style.borderColor='var(--border-400)'; this.style.color='var(--text-500)'; this.style.background='transparent';">
                        注册
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs py-3" style="color: var(--text-400);">
        &copy; 2026 Horizon Game Studio. All rights reserved.
    </footer>

    <style>
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        25% { transform: translateY(-24px) translateX(8px); }
        50% { transform: translateY(-36px) translateX(-5px); }
        75% { transform: translateY(-16px) translateX(-10px); }
      }
      @keyframes float-medium {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        25% { transform: translateY(-18px) translateX(-6px); }
        50% { transform: translateY(-28px) translateX(5px); }
        75% { transform: translateY(-10px) translateX(8px); }
      }
      .float-slow { animation: float-slow 7s ease-in-out infinite; }
      .float-medium { animation: float-medium 5s ease-in-out infinite; }

      /* 太阳动画 */
      @keyframes sun-glow {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
      }

      /* 火箭升空动画 */
      @keyframes rocket-rise {
        0%, 100% { transform: translateY(0); }
        30% { transform: translateY(-18px); }
        60% { transform: translateY(-8px); }
      }
      @keyframes trail-particle {
        0% { transform: translateY(0); opacity: 0.5; }
        100% { transform: translateY(40px); opacity: 0; }
      }
    </style>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });
    </script>
</body>
</html>
