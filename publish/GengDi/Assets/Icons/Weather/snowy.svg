<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="50%" style="stop-color:#E0E0E0"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,0)">
    <animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="50" cy="38" rx="24" ry="13" fill="url(#cloudGrad)"/>
    <ellipse cx="38" cy="29" rx="15" ry="11" fill="url(#cloudGrad)"/>
    <ellipse cx="62" cy="30" rx="13" ry="9" fill="url(#cloudGrad)"/>
    <ellipse cx="50" cy="34" rx="18" ry="8" fill="#D8D8D8" opacity="0.7"/>
  </g>
  <g>
    <circle cx="40" cy="62" r="3.5" fill="#FFFFFF" opacity="0.95">
      <animate attributeName="cy" values="62;78;62" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.2;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="62" r="3.5" fill="#FFFFFF" opacity="0.95">
      <animate attributeName="cy" values="62;78;62" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.2;0.95" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="62" r="3.5" fill="#FFFFFF" opacity="0.95">
      <animate attributeName="cy" values="62;78;62" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.2;0.95" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
