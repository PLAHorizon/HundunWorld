<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="50%" style="stop-color:#E0E0E0"/>
      <stop offset="100%" style="stop-color:#B0B0B0"/>
    </linearGradient>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6"/>
      <stop offset="100%" style="stop-color:#42A5F5"/>
    </linearGradient>
  </defs>
  
  <!-- 云朵 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,0;0,0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="50" cy="38" rx="28" ry="16" fill="url(#cloudGrad)"/>
    <ellipse cx="38" cy="28" rx="18" ry="14" fill="url(#cloudGrad)"/>
    <ellipse cx="62" cy="30" rx="16" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="50" cy="32" rx="20" ry="10" fill="#D0D0D0" opacity="0.8"/>
  </g>
  
  <!-- 雨滴 -->
  <g>
    <ellipse cx="40" cy="62" rx="2" ry="5" fill="url(#rainGrad)">
      <animate attributeName="cy" values="55;72;55" dur="0.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="50" cy="62" rx="2" ry="5" fill="url(#rainGrad)">
      <animate attributeName="cy" values="55;72;55" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="60" cy="62" rx="2" ry="5" fill="url(#rainGrad)">
      <animate attributeName="cy" values="55;72;55" dur="0.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="45" cy="65" rx="1.5" ry="4" fill="#90CAF9">
      <animate attributeName="cy" values="58;75;58" dur="0.8s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.8s" begin="0.15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="55" cy="65" rx="1.5" ry="4" fill="#90CAF9">
      <animate attributeName="cy" values="58;75;58" dur="0.8s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.8s" begin="0.45s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
